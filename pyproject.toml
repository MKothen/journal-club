[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-club"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["gspread>=6", "requests>=2.31", "urllib3>=2.6.0", "Jinja2>=3.1", "MarkupSafe>=2.0", "segno>=1.6", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["sync", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
