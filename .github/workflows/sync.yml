name: sync
on:
  schedule:
    - cron: "17 */3 * * *"
    # Wednesdays at 07:17 and 08:17 UTC: the 08:00 reminder's first chances,
    # 08:17 and 09:17 in winter, 09:17 and 10:17 in summer. Neither hour is
    # one of the three-hourly runs, so no run is doubled.
    - cron: "17 7,8 * * 3"
  workflow_dispatch:

concurrency:
  group: journal-club-sync
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Configure git identity
        run: |
          git config user.name "journal-club-bot"
          git config user.email "bot@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Sync
        id: sync
        timeout-minutes: 10
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: python -m sync.cli sync
      - name: Commit the archive
        timeout-minutes: 5
        run: |
          mkdir -p explainers
          git add data explainers
          git diff --cached --quiet || git commit -m "chore: sync archive"
          git push
      - name: Build
        timeout-minutes: 10
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m sync.cli build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
      - name: Announce
        if: always()
        timeout-minutes: 10
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: python -m sync.cli announce
      # Sync stays green when only a notice failed to post, so the archive is
      # committed and the site built; the run turns red here instead.
      - name: Fail if a notice was not posted
        if: always() && steps.sync.outputs.notices_failed != '' && steps.sync.outputs.notices_failed != '0'
        run: exit 1
      # The monitor hears of every run that finishes, and of whether it failed:
      # when the webhook itself is dead, Report failure cannot reach anyone.
      - name: Ping the monitor
        if: success()
        env:
          MONITOR_PING_URL: ${{ secrets.MONITOR_PING_URL }}
        run: curl -fsS -m 10 --retry 3 "$MONITOR_PING_URL" || true
      - name: Tell the monitor the run failed
        if: failure()
        env:
          MONITOR_PING_URL: ${{ secrets.MONITOR_PING_URL }}
        run: curl -fsS -m 10 --retry 3 "$MONITOR_PING_URL/fail" || true
      - name: Report failure
        if: failure()
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \"Journal club sync failed: $RUN_URL\"}" \
            "$MATTERMOST_WEBHOOK_URL" || true
